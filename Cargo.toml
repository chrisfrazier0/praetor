[package]
name = "praetor"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Chris Frazier"]
description = "A small, strongly typed authorization library for Rust built around composable can and cannot rules."
license = "MIT"
readme = "README.md"
repository = "https://github.com/chrisfrazier0/praetor"
homepage = "https://praetor.frazier.software"
documentation = "https://docs.rs/praetor"
keywords = ["authorization", "auth", "permissions", "access-control"]
categories = ["authentication", "rust-patterns", "web-programming"]

[dependencies]
axum = { version = "0.8", default-features = false, optional = true }

[features]
axum = ["dep:axum"]

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "axum"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
